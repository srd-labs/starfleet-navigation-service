# Mount the Navigation service secret directly from Google Secret Manager.
#
# Authentication to Secret Manager is provided by the navigation-service
# Kubernetes ServiceAccount through GKE Workload Identity.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: navigation-secrets
  namespace: default

spec:
  provider: gke

  parameters:
    secrets: |
      - resourceName: "projects/starfleet-gke-platform-lab/secrets/navigation-service-secret/versions/latest"
        path: "navigation-service-secret"
