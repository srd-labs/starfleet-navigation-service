name: Deploy Navigation Service

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: starfleet-gke-platform-lab
  REGION: us-central1
  GAR_REPOSITORY: starfleet-apps
  IMAGE_NAME: starfleet-navigation-service
  GKE_CLUSTER: enterprise-gke-alpha
  GKE_LOCATION: us-central1-a

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Check out the application source code used to build the container image.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using GitHub OIDC and Workload
      # Identity Federation without storing a service-account key.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Install the Google Cloud CLI used for Artifact Registry operations.
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      # Configure Docker to authenticate to the regional Artifact Registry.
      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # Build the Navigation service image for the amd64 architecture
      # used by the GKE nodes and tag it with the immutable Git commit SHA.
      - name: Build Navigation image
        run: |
          docker build \
            --platform linux/amd64 \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      # Scan the image for HIGH and CRITICAL vulnerabilities before it
      # is allowed to proceed to Artifact Registry.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: table
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
          skip-files: "/usr/local/lib/python3.13/site-packages/pip/_vendor/bom.cdx.json"

      # Publish only an image that has passed the vulnerability gate.
      - name: Push Navigation image
        run: |
          docker push \
            "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

      # Install the gcloud beta component required for the
      # Binary Authorization sign-and-create command.
      - name: Install gcloud beta component
        run: |
          gcloud components install beta --quiet

      # Sign the pushed image digest with Cloud KMS and create a
      # Binary Authorization attestation before deploying to GKE.
      - name: Create Binary Authorization attestation
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          DIGEST=$(gcloud artifacts docker images describe "$IMAGE" \
            --project="${PROJECT_ID}" \
            --format="value(image_summary.digest)")

          IMAGE_BY_DIGEST="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}@${DIGEST}"

          echo "IMAGE_BY_DIGEST=${IMAGE_BY_DIGEST}" >> "$GITHUB_ENV"

          echo "Image digest:"
          echo "${IMAGE_BY_DIGEST}"

          EXISTING_ATTESTATION=$(gcloud container binauthz attestations list \
            --project="${PROJECT_ID}" \
            --attestor="starfleet-image-attestor" \
            --attestor-project="${PROJECT_ID}" \
            --format="value(resourceUri)" \
            | grep -F "${IMAGE_BY_DIGEST}" || true)

          if [ -n "${EXISTING_ATTESTATION}" ]; then
            echo "Attestation already exists for this image."
            echo "Skipping attestation creation."
          else
            echo "Creating attestation for:"
            echo "${IMAGE_BY_DIGEST}"

            gcloud beta container binauthz attestations sign-and-create \
              --project="${PROJECT_ID}" \
              --artifact-url="${IMAGE_BY_DIGEST}" \
              --attestor="starfleet-image-attestor" \
              --attestor-project="${PROJECT_ID}" \
              --keyversion-project="${PROJECT_ID}" \
              --keyversion-location="global" \
              --keyversion-keyring="starfleet-binauthz-keyring" \
              --keyversion-key="starfleet-image-attestation-key" \
              --keyversion="1"
          fi


     # Retrieve short-lived Kubernetes credentials for the Alpha cluster.
      - name: Get Alpha GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}

      # Update only the Navigation deployment to the image produced
      # by this workflow run.
      - name: Deploy Navigation to Alpha GKE
        run: |
          echo "Deploying attested image:"
          echo "${IMAGE_BY_DIGEST}"

          kubectl set image deployment/starfleet-navigation-service \
            navigation-service="${IMAGE_BY_DIGEST}"

      # Wait for the rolling update to complete and display the resulting pods.
      - name: Verify Alpha deployment
        run: |
          kubectl rollout status deployment/starfleet-navigation-service --timeout=180s

          echo ""
          echo "Navigation pods:"
          kubectl get pods -l app=starfleet-navigation-service -o wide
