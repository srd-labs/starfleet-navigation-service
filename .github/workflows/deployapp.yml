name: Deploy Navigation Service

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: starfleet-gke-platform-lab
  REGION: us-central1
  GAR_REPOSITORY: starfleet-apps
  IMAGE_NAME: starfleet-navigation-service

jobs:
  deploy:
    name: Authenticate with Google Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using GitHub OIDC and
      # Workload Identity Federation. No service account key is used.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-deployer@starfleet-gke-platform-lab.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      # Verify that the workflow received temporary Google Cloud
      # credentials and is operating against the correct project.
      - name: Verify Google Cloud authentication
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref type: ${{ github.ref_type }}"
          
          gcloud auth list
          gcloud auth print-access-token >/dev/null

          gcloud config set project "$PROJECT_ID"
          gcloud config get-value project


      # Configure Docker authentication for the existing
      # Artifact Registry repository.
      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
