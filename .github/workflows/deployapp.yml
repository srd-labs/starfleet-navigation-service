name: Deploy Navigation Service

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: starfleet-gke-platform-lab
  REGION: us-central1
  GAR_REPOSITORY: starfleet-apps
  IMAGE_NAME: starfleet-navigation-service

jobs:
  deploy:
    name: Authenticate with Google Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using GitHub OIDC and
      # Workload Identity Federation. No service account key is used.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      # Verify that the workflow received temporary Google Cloud
      # credentials and is operating against the correct project.
      - name: Verify Google Cloud authentication
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref type: ${{ github.ref_type }}"
          
          gcloud auth list
          gcloud auth print-access-token >/dev/null

          gcloud config set project "$PROJECT_ID"
          gcloud config get-value project


      # Configure Docker authentication for the existing
      # Artifact Registry repository.
      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # Build the Navigation service container image for the linux/amd64
      # architecture used by the GKE nodes.
      #
      # Tag the image with the Git commit SHA so every deployment can be
      # traced back to the exact source-code revision that produced it.
      - name: Build Navigation image
        run: |
          docker build \
            --no-cache \
            --platform linux/amd64 \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      # Verify the versions of vulnerable Python packages inside the
      # exact container image that will be scanned and published.
      - name: Check Python package versions
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker run --rm "$IMAGE" python -c "
          import msgpack
          import setuptools
          print('msgpack:', msgpack.__version__)
          print('setuptools:', setuptools.__version__)
          "

      # Verify whether the vulnerable package versions reported by Trivy
      # originate from the SBOM bundled with pip rather than the runtime packages.
      - name: Inspect pip vendored SBOM
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker run --rm "$IMAGE" sh -c '
            find /usr/local/lib -path "*/pip/_vendor/bom.cdx.json" -print
          '

      - name: Check vulnerable versions in pip SBOM
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker run --rm "$IMAGE" sh -c '
            grep -E "\"(msgpack|setuptools)\"" \
              /usr/local/lib/python*/site-packages/pip/_vendor/bom.cdx.json \
              | head -20 || true
          '


      # Scan the container image for HIGH and CRITICAL vulnerabilities.
      #
      # The pip distribution includes a vendored CycloneDX SBOM that may
      # describe older internal components even when the runtime packages
      # have already been upgraded. Skip that metadata file so the scan
      # evaluates the packages actually present in the application image.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: table
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
          skip-files: "/usr/local/lib/python3.13/site-packages/pip/_vendor/bom.cdx.json"

      # Push only an image that passed the vulnerability scan to the
      # Starfleet Artifact Registry repository.
      - name: Push Navigation image
        run: |
          docker push \
            "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

